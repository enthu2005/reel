plugins {
    id 'com.android.application'
}

android {
    namespace 'com.enthu.reel'
    compileSdk 35
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.enthu.reel'
        minSdk 23
        targetSdk 30
        versionCode 1
        versionName '0.1'
    }

    // The release key lives outside the repo (never commit it): %USERPROFILE%\.reel-keys\keystore.properties
    def keyProps = new Properties()
    def keyFile = new File(System.getProperty('user.home'), '.reel-keys/keystore.properties')
    if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }

    signingConfigs {
        release {
            if (keyProps['storeFile']) {
                storeFile file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keyProps['storeFile']) signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false // the lint-vital step crashes inside the Android Gradle plugin here
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'com.google.zxing:core:3.5.3' // the QR code for the phone remote
}
