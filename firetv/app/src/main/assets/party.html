<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Reel party</title>
<style>
  :root { --bg:#0b0b0d; --card:#17181c; --line:#26272d; --text:#f4f4f6; --dim:#9a9ca6; --accent:#e8833a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text);
    font:16px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px calc(40px + env(safe-area-inset-bottom)); }
  h1 { font-size:24px; margin:6px 0 2px; }
  .sub { color:var(--dim); font-size:14px; margin-bottom:14px; }
  .clock { text-align:center; font-size:46px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--accent);
    margin:4px 0 10px; }
  .clock.low { color:#ff5a5a; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { transform:scale(1.08); } }
  .film { display:flex; gap:12px; align-items:center; padding:10px; margin:8px 0; background:var(--card);
    border:1px solid var(--line); border-radius:14px; position:relative; overflow:hidden; }
  .film.mine { border-color:var(--accent); }
  .film .bar { position:absolute; left:0; top:0; bottom:0; width:0; background:rgba(232,131,58,.16); transition:width .5s; }
  .film > * { position:relative; }
  .rank { width:22px; text-align:center; color:var(--dim); font-variant-numeric:tabular-nums; flex:none; }
  .film img { width:52px; height:78px; object-fit:cover; border-radius:8px; background:#222; flex:none; }
  .txt { flex:1; min-width:0; }
  .txt b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .txt span { color:var(--dim); font-size:13px; }
  .count { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; width:34px; text-align:right; flex:none; }
  button { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:12px; font:inherit;
    padding:10px 14px; flex:none; }
  button.vote { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.done { background:none; color:var(--accent); border-color:var(--accent); }
  .win { text-align:center; padding:18px 12px 20px; margin:10px 0 16px; border:1px solid var(--accent); border-radius:16px;
    background:rgba(232,131,58,.12); }
  .win img { width:150px; border-radius:12px; display:block; margin:10px auto 8px; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  .win b { display:block; font-size:24px; margin-top:2px; }
  .hide { display:none; }
  #q { width:100%; padding:12px 14px; font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:12px; outline:none; margin-bottom:6px; }
  #q:focus { border-color:var(--accent); }
  #fx { position:fixed; inset:0; pointer-events:none; }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main>
  <h1 id="h">Pick tonight's film</h1>
  <div class="sub" id="sub"></div>
  <div id="adder" class="hide">
    <input id="q" type="search" placeholder="Add a film from the library" autocomplete="off">
    <div class="sub" id="addMsg"></div>
    <div id="found"></div>
  </div>
  <div class="clock hide" id="clock"></div>
  <div class="win hide" id="win">The winner is<img id="winImg" alt=""><b id="winT"></b><div class="sub" id="winV"></div></div>
  <div id="list"></div>
  <div id="game" class="hide"></div>
</main>
<script>
const P = new URLSearchParams(location.search).get('p') || '';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LOBBY = 0, VOTING = 1, DONE = 2;
let last = null, gotAt = 0, boomed = false;

async function call(path, extra) {
  try {
    const r = await fetch(path + '?p=' + encodeURIComponent(P) + (extra || ''), {cache: 'no-store'});
    if (r.status === 403) { document.body.innerHTML = '<main><h1>This party has ended</h1></main>'; return null; }
    return await r.json();
  } catch (e) { return null; }
}

function fmt(ms) {
  const s = Math.ceil(ms / 1000), m = Math.floor(s / 60);
  return m + ':' + String(s % 60).padStart(2, '0');
}

function render(s) {
  if (!s) return;
  if (s.mode) { renderGame(s); return; }
  last = s; gotAt = performance.now();
  if (s.phase !== DONE) boomed = false;
  const canAdd = s.canAdd && s.addsLeft > 0;
  $('adder').classList.toggle("hide", !canAdd);
  if (canAdd) $('addMsg').textContent = "You can add " + s.addsLeft + (s.addsLeft === 1 ? " more film" : " more films") + " to the vote.";
  else $('found').innerHTML = "";
  const max = Math.max(1, ...s.films.map(f => f.votes));
  $('sub').textContent = s.phase === LOBBY ? 'Waiting for the host to start the vote…'
    : s.phase === VOTING ? s.voters + (s.voters === 1 ? ' vote' : ' votes') + ' so far. One vote each; tap another film to change it.'
    : 'Voting has closed.';
  const w = s.films.find(f => f.key === s.winner);
  $('win').classList.toggle('hide', !(w && s.phase === DONE));
  if (w && s.phase === DONE) {
    $('winT').textContent = w.title;
    $('winV').textContent = w.votes + (w.votes === 1 ? ' vote' : ' votes');
    $('winImg').src = w.thumb ? '/party/img?p=' + encodeURIComponent(P) + '&path=' + encodeURIComponent(w.thumb) : '';
    if (!boomed) { boomed = true; burst(); }
  }
  $('list').innerHTML = s.films.map((f, i) =>
    '<div class="film' + (f.key === s.mine ? ' mine' : '') + '"><div class="bar" style="width:' + (s.phase === LOBBY ? 0 : 100 * f.votes / max) + '%"></div>' +
    '<div class="rank">' + (i + 1) + '</div>' +
    '<img alt="" loading="lazy" src="' + (f.thumb ? '/party/img?p=' + encodeURIComponent(P) + '&path=' + encodeURIComponent(f.thumb) : '') + '">' +
    '<div class="txt"><b>' + esc(f.title) + '</b><span>' + esc(f.sub) + '</span></div>' +
    (s.phase === LOBBY ? '' : '<div class="count">' + f.votes + '</div>') +
    (s.phase === VOTING ? '<button class="' + (f.key === s.mine ? 'done' : 'vote') + '" data-k="' + f.key + '">' + (f.key === s.mine ? 'Voted' : 'Vote') + '</button>' : '') +
    '</div>').join('');
  document.querySelectorAll('button[data-k]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    render(await call('/party/vote', '&key=' + encodeURIComponent(b.dataset.k)));
  });
  clock();
}

function clock() {
  const c = $('clock');
  if (!last || last.phase !== VOTING) { c.classList.add('hide'); return; }
  const left = Math.max(0, last.left - (performance.now() - gotAt));
  c.classList.remove('hide');
  c.textContent = fmt(left);
  c.classList.toggle('low', left < 10000);
}
setInterval(clock, 250);

// a little firework on the phone when the winner is known
const cv = $('fx'), g = cv.getContext('2d');
let parts = [];
function size() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', size); size();
function burst() {
  for (let k = 0; k < 5; k++) setTimeout(() => {
    const x = innerWidth * (0.15 + Math.random() * 0.7), y = innerHeight * (0.15 + Math.random() * 0.4);
    const hue = Math.random() * 360;
    for (let i = 0; i < 70; i++) {
      const a = Math.random() * 6.283, v = 1.5 + Math.random() * 4.5;
      parts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, hue: hue + Math.random() * 40});
    }
  }, k * 450);
}
function frame() {
  g.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.vx *= 0.99; p.life -= 0.012;
    g.globalAlpha = Math.max(0, p.life);
    g.fillStyle = 'hsl(' + p.hue + ',90%,60%)';
    g.fillRect(p.x, p.y, 3, 3);
  }
  requestAnimationFrame(frame);
}
frame();

// ---------------------------------------------------------------- guess the film / movie quiz
const COLORS = ['#e0524d', '#3d8bfd', '#e8b13a', '#3fb27f'];
let myName = '', joining = false, boomedGame = false;
try { myName = localStorage.getItem('reelName') || ''; } catch (e) {}

async function joinAs(name) {
  joining = true;
  try { localStorage.setItem('reelName', name); } catch (e) {}
  myName = name;
  const r = await call('/party/join', '&n=' + encodeURIComponent(name));
  joining = false;
  if (r) renderGame(r);
}

function boardHtml(s, n) {
  return '<div class="list">' + (s.board || []).slice(0, n).map((b, i) =>
    '<div class="item"><span class="t">' + (i + 1) + '. ' + esc(b.name) + '</span><span class="ms">' + b.score + '</span></div>').join('') + '</div>';
}

function renderGame(s) {
  last = s; gotAt = performance.now();
  ['adder', 'list', 'win', 'clock'].forEach(id => $(id).classList.add('hide'));
  $('game').classList.remove('hide');
  $('h').textContent = s.mode === 1 ? 'Guess the film' : 'Movie quiz night';
  $('sub').textContent = '';
  const g = $('game');
  if (!s.name) {
    if (myName && !joining) { joinAs(myName); return; }
    if (!document.getElementById('nm')) {
      g.innerHTML = '<div class="sub">Pick a name for the scoreboard</div><input id="nm" maxlength="14" placeholder="Your name" autocomplete="off" style="width:100%;padding:12px 14px;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;outline:none;margin-bottom:10px"><button class="vote" id="go" style="width:100%;padding:14px">Join</button>';
      $('go').onclick = () => { const v = $('nm').value.trim(); if (v) joinAs(v); };
    }
    return;
  }
  if (s.gPhase === 0) {
    g.innerHTML = '<div class="sub">Hi ' + esc(s.name) + '! Waiting for the host to start… ' + s.players + (s.players === 1 ? ' player' : ' players') + ' in.</div>' + boardHtml(s, 8);
    return;
  }
  if (s.gPhase === 3) {
    g.innerHTML = '<div class="win">Game over<b>You finished #' + s.myRank + '</b><div class="sub">' + s.myScore + ' points</div></div>' + boardHtml(s, 8);
    if (!boomedGame) { boomedGame = true; burst(); }
    return;
  }
  boomedGame = false;
  const asking = s.gPhase === 1, correct = s.correct;
  let html = '<div class="sub">Round ' + (s.round + 1) + ' of ' + s.total + ' · ' + s.myScore + ' points</div>';
  if (asking) html += '<div class="clock" id="gclock"></div>';
  html += '<div style="font-size:19px;margin:6px 0 14px;font-weight:600">' + esc(s.prompt) + '</div>';
  (s.options || []).forEach((o, i) => {
    let st = 'background:' + COLORS[i] + ';color:#fff;';
    if (!asking) {
      if (i === correct) st = 'background:#2faa63;color:#fff;';
      else st = 'background:#2a2b31;color:#777;' + (i === s.myChoice ? 'outline:2px solid #e0524d;' : '');
    } else if (s.myChoice >= 0 && i !== s.myChoice) st += 'opacity:.35;';
    html += '<button data-i="' + i + '" style="' + st + 'width:100%;padding:16px;margin:6px 0;font-size:17px;border:0;text-align:left"' + (asking && s.myChoice < 0 ? '' : ' disabled') + '>' + esc(o) + (i === s.myChoice ? '  ✓' : '') + '</button>';
  });
  if (asking) html += '<div class="sub">' + (s.myChoice >= 0 ? 'Locked in — waiting for the others (' + s.answered + '/' + s.players + ')' : s.answered + '/' + s.players + ' answered') + '</div>';
  else html += '<div class="sub" style="font-size:18px;color:' + (s.myPoints ? '#3fb27f' : '#e0524d') + '">' + (s.myChoice < 0 ? 'Too slow!' : s.myPoints ? '+' + s.myPoints + ' points' : 'Not this time') + '</div>' + boardHtml(s, 5);
  g.innerHTML = html;
  g.querySelectorAll('button[data-i]').forEach(b => b.onclick = async () => {
    g.querySelectorAll('button').forEach(x => x.disabled = true);
    const r = await call('/party/answer', '&r=' + s.round + '&i=' + b.dataset.i);
    if (r) renderGame(r);
  });
  clockGame();
}

function clockGame() {
  const c = $('gclock');
  if (!c || !last || last.gPhase !== 1) return;
  const left = Math.max(0, last.left - (performance.now() - gotAt));
  c.textContent = Math.ceil(left / 1000);
  c.classList.toggle('low', left < 5000);
}
setInterval(clockGame, 250);

let findTimer = null, findSeq = 0;
$('q').addEventListener('input', () => { clearTimeout(findTimer); findTimer = setTimeout(find, 350); });
async function find() {
  const text = $('q').value.trim(), mine = ++findSeq;
  if (text.length < 2) { $('found').innerHTML = ''; return; }
  const r = await call('/party/search', '&q=' + encodeURIComponent(text));
  if (mine !== findSeq || !r) return;
  const rows = r.results || [];
  $('found').innerHTML = rows.length ? rows.map((f, i) =>
    '<div class="film"><img alt="" src="' + (f.thumb ? '/party/img?p=' + encodeURIComponent(P) + '&path=' + encodeURIComponent(f.thumb) : '') + '">' +
    '<div class="txt"><b>' + esc(f.title) + '</b><span>' + esc(f.sub) + '</span></div>' +
    '<button class="vote" data-a="' + i + '">Add</button></div>').join('') : '<div class="sub">Nothing found in this library.</div>';
  $('found').querySelectorAll('button[data-a]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const res = await call('/party/add', '&key=' + encodeURIComponent(rows[+b.dataset.a].key));
    $('addMsg').textContent = res && res.ok ? 'Added!' : 'Could not add: ' + ((res && res.why) || 'try again');
    if (res && res.ok) { $('q').value = ''; $('found').innerHTML = ''; }
    tick();
  });
}

async function tick() { render(await call('/party/state')); }
tick(); setInterval(tick, 1500);
</script>
</body>
</html>
